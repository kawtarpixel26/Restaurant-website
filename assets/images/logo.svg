<svg width="240" height="54" viewBox="0 0 240 54" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0D0"/>
      <stop offset="40%" stop-color="#E4C590"/>
      <stop offset="85%" stop-color="#C29853"/>
      <stop offset="100%" stop-color="#8F6322"/>
    </linearGradient>
    <linearGradient id="flame" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#E4C590"/>
      <stop offset="50%" stop-color="#F39C12"/>
      <stop offset="90%" stop-color="#E74C3C"/>
      <stop offset="100%" stop-color="#FFD700"/>
    </linearGradient>
    <filter id="forgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="glow"/>
      <feComposite in="SourceGraphic" in2="glow" operator="over"/>
    </filter>
  </defs>

  <!-- Emblem Group -->
  <g transform="translate(6, 4)">
    <!-- Outer Octagonal / Circular Badge Border -->
    <circle cx="23" cy="23" r="22" stroke="url(#goldGlow)" stroke-width="1.2" opacity="0.8"/>
    <circle cx="23" cy="23" r="19.5" stroke="#E4C590" stroke-width="0.7" stroke-dasharray="2.5 1.5" opacity="0.5"/>

    <!-- Anvil Silhouette -->
    <!-- Base -->
    <path d="M13 32 L33 32 L30 36 L16 36 Z" fill="url(#goldGlow)"/>
    <!-- Body -->
    <path d="M18 26 L28 26 L29 32 L17 32 Z" fill="url(#goldGlow)"/>
    <!-- Anvil Horn & Face -->
    <path d="M10 23 C10 23 15 22.5 18 23 L31 23 C34 23 36.5 20.5 37 18.5 L35.5 18.5 C34 20.5 32 21.5 29 21.5 L18 21.5 C15 21.5 12 22 10 23 Z" fill="url(#goldGlow)"/>
    <rect x="16" y="22" width="15" height="3" rx="0.5" fill="url(#goldGlow)"/>

    <!-- Forge Flame Rising from Anvil -->
    <path d="M23 9 C25 12.5 27.5 14.5 26.8 18 C26 21 23.5 22.5 23 22.5 C22.5 22.5 20 21 19.2 18 C18.5 14.5 21 12.5 23 9 Z" fill="url(#flame)" filter="url(#forgeGlow)"/>
    <!-- Inner Core Flame -->
    <path d="M23 13 C24 15.2 25.2 16.5 24.8 18.5 C24.4 20 23.5 20.8 23 20.8 C22.5 20.8 21.6 20 21.2 18.5 C20.8 16.5 22 15.2 23 13 Z" fill="#FFFBF0"/>

    <!-- Forging Sparks -->
    <circle cx="17" cy="12" r="0.9" fill="#F7E2B8"/>
    <circle cx="29" cy="13" r="0.9" fill="#F7E2B8"/>
    <circle cx="23" cy="6.5" r="1.1" fill="#FFF0D0"/>
  </g>

  <!-- Typography: Pure Vector Outlines for 100% Cross-Browser Fidelity -->
  <!-- "BLACKSMITH" Lettering -->
  <g fill="url(#goldGlow)">
    <!-- B -->
    <path d="M60 13 H68 C70.5 13 72.2 14.2 72.2 16.2 C72.2 17.5 71.4 18.5 70.2 19 C71.8 19.5 72.8 20.7 72.8 22.5 C72.8 24.8 70.8 26 68 26 H60 V13 Z M62.4 15.2 V18.3 H67.5 C69 18.3 70 17.6 70 16.6 C70 15.6 69 15.2 67.5 15.2 H62.4 Z M62.4 20.4 V23.8 H68 C69.6 23.8 70.6 23.1 70.6 22 C70.6 20.9 69.6 20.4 68 20.4 H62.4 Z"/>
    
    <!-- L -->
    <path d="M76 13 H78.4 V23.8 H85 V26 H76 V13 Z"/>
    
    <!-- A -->
    <path d="M91.5 13 H94 L100 26 H97.4 L95.9 22.8 H89.6 L88.1 26 H85.5 L91.5 13 Z M94.8 20.6 L92.8 16.2 L90.7 20.6 H94.8 Z"/>
    
    <!-- C -->
    <path d="M109.8 16.5 C109.1 14.7 107.5 13 104.5 13 C101 13 98.2 15.8 98.2 19.5 C98.2 23.2 101 26 104.5 26 C107.5 26 109.2 24.3 109.8 22.5 H107.2 C106.6 23.5 105.7 24 104.5 24 C102.3 24 100.7 22.1 100.7 19.5 C100.7 16.9 102.3 15 104.5 15 C105.7 15 106.6 15.5 107.2 16.5 H109.8 Z"/>
    
    <!-- K -->
    <path d="M113 13 H115.4 V18.5 L121.2 13 H124.2 L118.2 19.1 L124.5 26 H121.3 L116.5 20.8 L115.4 21.9 V26 H113 V13 Z"/>
    
    <!-- S -->
    <path d="M132 15.8 C131.3 14.2 129.8 13 127.8 13 C125.4 13 123.8 14.3 123.8 16.2 C123.8 18 125 18.9 127.2 19.5 L128.5 19.8 C130.5 20.4 131.4 21.2 131.4 22.6 C131.4 24.6 129.6 26 127.4 26 C124.8 26 123.2 24.5 122.5 22.6 H124.8 C125.4 23.7 126.3 24.2 127.4 24.2 C128.5 24.2 129.4 23.5 129.4 22.4 C129.4 21.2 128.5 20.5 126.8 20.1 L125.5 19.7 C123.8 19.2 122 18.2 122 16.1 C122 14.1 123.8 13 126 13 C127.8 13 129.2 13.9 129.8 15.8 H132 Z"/>
    
    <!-- M -->
    <path d="M135 13 H138 L141.5 21 L145 13 H148 V26 H145.8 V16.8 L142.4 24.5 H140.6 L137.2 16.8 V26 H135 V13 Z"/>
    
    <!-- I -->
    <path d="M152 13 H154.4 V26 H152 V13 Z"/>
    
    <!-- T -->
    <path d="M157 15.2 V13 H167 V15.2 H163.2 V26 H160.8 V15.2 H157 Z"/>
    
    <!-- H -->
    <path d="M170 13 H172.4 V18.3 H178.6 V13 H181 V26 H178.6 V20.5 H172.4 V26 H170 V13 Z"/>
  </g>

  <!-- Elegant Gold Divider with Star Accent -->
  <line x1="60" y1="32" x2="114" y2="32" stroke="url(#goldGlow)" stroke-width="0.8" opacity="0.6"/>
  <polygon points="121,30.5 122,32.5 124,32.5 122.5,33.5 123,35.5 121,34 119,35.5 119.5,33.5 118,32.5 120,32.5" fill="#E4C590"/>
  <line x1="128" y1="32" x2="232" y2="32" stroke="url(#goldGlow)" stroke-width="0.8" opacity="0.6"/>

  <!-- Subtitle: AGADIR · RESTAURANT & LOUNGE -->
  <text x="60" y="44" font-family="'DM Sans', -apple-system, sans-serif" font-size="8.5" font-weight="700" letter-spacing="3.2" fill="#FFFFFF" opacity="0.95">AGADIR · RESTAURANT &amp; GRILL</text>
</svg>
